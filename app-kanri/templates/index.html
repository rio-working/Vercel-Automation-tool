<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --font-family: 'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
      --bg-primary: #fffaf0;
      --bg-card: #ffffff;
      --text-primary: #5c4033;
      --accent-primary: #ff9e4a;
      --accent-gradient: linear-gradient(135deg, #ff9e4a 0%, #ffcc80 100%);
      --border-default: rgba(255, 158, 74, 0.15);
      --radius-lg: 20px;
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      padding-bottom: 60px;
      transition: background 0.4s, color 0.4s;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 15px;
    }

    /* ヘッダー */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 10px 0;
    }

    header h1 {
      font-size: 1.4rem;
      margin: 0;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    /* お知らせバー */
    .notice-bar {
      background: linear-gradient(135deg, #fff5e6 0%, #fffaf0 100%);
      border: 1px solid var(--accent-primary);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.5s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 統計ボックス */
    .stats-box {
      background: var(--bg-card);
      padding: 18px;
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
      border: 1px solid var(--border-default);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .stats-row {
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-primary);
    }

    .stat-label {
      font-size: 0.75rem;
      opacity: 0.7;
    }

    /* 進捗バー */
    .progress-wrap {
      width: 100%;
      height: 8px;
      background: var(--border-default);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-gradient);
      border-radius: 99px;
      transition: width 0.8s ease;
      width: 0%;
    }

    .progress-label {
      font-size: 0.75rem;
      opacity: 0.7;
      text-align: right;
    }

    /* ツールバー */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-default);
      font-size: 0.9rem;
      background: var(--bg-card);
      color: var(--text-primary);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(255, 158, 74, 0.15);
    }

    /* フィルタチップ */
    .filter-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
    }

    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .chip {
      padding: 8px 16px;
      border-radius: 99px;
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .chip:hover {
      border-color: var(--accent-primary);
    }

    .chip.active {
      background: var(--text-primary);
      color: var(--bg-card);
      border-color: var(--text-primary);
    }

    /* カード */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 22px;
      margin-bottom: 18px;
      border: 1px solid var(--border-default);
      position: relative;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
    }

    .card-fav {
      position: absolute;
      top: 18px;
      right: 18px;
      cursor: pointer;
      color: #ddd;
      transition: color 0.2s, transform 0.2s;
    }

    .card-fav:hover {
      transform: scale(1.15);
    }

    .card-fav.active {
      color: #facc15;
    }

    .card-tag {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--accent-primary);
      background: linear-gradient(135deg, #fff5e6 0%, #fffaf0 100%);
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
    }

    .card-meta {
      font-size: 0.75rem;
      color: #888;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .new-badge {
      background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.7;
      }
    }

    .card h2 {
      margin: 10px 0;
      font-size: 1.15rem;
      line-height: 1.4;
    }

    .card p {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .card-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* ボタン */
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .btn:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: white;
    }

    .btn-outline {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      color: var(--text-primary);
    }

    .btn-outline:hover {
      border-color: var(--accent-primary);
    }

    .btn-icon {
      padding: 10px;
      min-width: 40px;
    }

    .btn-like {
      background: #fff;
      border: 1px solid #fecaca;
    }

    .btn-like:hover {
      background: #fef2f2;
    }

    /* モーダル */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-content {
      background: var(--bg-card);
      width: 100%;
      max-width: 520px;
      padding: 28px;
      border-radius: var(--radius-lg);
      max-height: 90vh;
      overflow-y: auto;
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-content h2,
    .modal-content h3 {
      margin-top: 0;
      color: var(--text-primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent-primary);
    }

    /* テーマグリッド */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .theme-item {
      aspect-ratio: 1;
      border: 2px solid transparent;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .theme-item:hover {
      transform: scale(1.1);
    }

    .theme-item.active {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 2px var(--bg-card), 0 0 0 4px var(--accent-primary);
    }

    /* モーダル内ボタンのクリック確保 */
    .modal-content .btn {
      position: relative;
      z-index: 10;
    }

    /* ローディング */
    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg-primary);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s;
    }

    .loading-spinner {
      font-size: 48px;
      color: var(--accent-primary);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    #loading p {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #888;
    }

    /* 空状態 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }

    .empty-state .material-icons {
      font-size: 64px;
      opacity: 0.3;
    }

    /* レスポンシブ */
    @media (max-width: 600px) {
      .theme-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .card-buttons {
        width: 100%;
        justify-content: flex-end;
      }

      .stats-row {
        flex-wrap: wrap;
        gap: 15px;
      }
    }
  </style>
</head>

<body>

  <div id="loading">
    <span class="material-icons loading-spinner">sync</span>
    <p>読み込み中...</p>
  </div>

  <div class="container">
    <div id="notice-area"></div>

    <header>
      <h1>アプリ管理</h1>
      <div class="header-actions">
        <button class="btn btn-outline" id="admin-btn" onclick="openAdminModal()">
          <span class="material-icons" style="font-size:18px">settings</span>管理
        </button>
        <button onclick="openSpreadsheet()" class="btn btn-outline btn-icon" title="スプレッドシート">
          <span class="material-icons" style="font-size:20px">table_chart</span>
        </button>
        <button onclick="openThemeModal()" class="btn btn-outline btn-icon">
          <span class="material-icons" style="font-size:20px">palette</span>
        </button>
      </div>
    </header>

    <div class="stats-box">
      <div class="stats-row">
        <div class="stat-item">
          <span id="stat-total" class="stat-value">0</span>
          <span class="stat-label">登録アプリ</span>
        </div>
        <div class="stat-item">
          <span id="stat-likes" class="stat-value">0</span>
          <span class="stat-label">総いいね</span>
        </div>
        <div class="stat-item">
          <span id="stat-categories" class="stat-value">0</span>
          <span class="stat-label">カテゴリ</span>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-label" id="progress-label"></div>
    </div>

    <div class="toolbar">
      <input type="text" id="search" class="search-input" placeholder="アプリを検索..." oninput="updateView()">
      <select id="sort" class="search-input" style="flex:0; min-width:130px;" onchange="updateView()">
        <option value="id">登録順</option>
        <option value="likes">人気順</option>
        <option value="date">更新順</option>
      </select>
    </div>

    <div id="category-bar" class="filter-scroll"></div>
    <div id="app-list"></div>
  </div>

  <!-- 管理モーダル -->
  <div id="adminModal" class="modal" onclick="closeModal(event, 'adminModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h2>管理者パネル</h2>

      <div class="form-group">
        <label>お知らせ更新</label>
        <input type="text" id="noticetxt" placeholder="お知らせ内容を入力...">
        <button onclick="saveNotice()" class="btn btn-primary" style="margin-top:8px; width:100%">お知らせを更新</button>
      </div>

      <hr style="border:none; border-top:1px solid #eee; margin:20px 0;">

      <h3>アプリ追加・編集</h3>
      <div class="form-group"><label>ID（数値）</label><input type="number" id="f-id" placeholder="自動採番（空欄可）"></div>
      <div class="form-group"><label>タイトル</label><input type="text" id="f-title" placeholder="アプリ名"></div>
      <div class="form-group"><label>説明</label><textarea id="f-desc" rows="3" placeholder="アプリの説明..."></textarea></div>
      <div class="form-group">
        <label>カテゴリ</label>
        <select id="f-cat" onchange="onCatChange()">
          <option value="">選択してください</option>
        </select>
        <input type="text" id="f-cat-new" placeholder="新しいカテゴリ名を入力" style="display:none; margin-top:6px;">
      </div>
      <div class="form-group"><label>作成日</label><input type="date" id="f-date"></div>
      <div class="form-group"><label>アプリURL</label><input type="text" id="f-url" placeholder="https://..."></div>
      <div class="form-group"><label>配布URL（ZIP等）</label><input type="text" id="f-zip" placeholder="https://..."></div>
      <div class="form-group"><label>スプレッドシートURL</label><input type="text" id="f-sheet" placeholder="https://..."></div>
      <div class="form-group"><label>note記事URL</label><input type="text" id="f-note" placeholder="https://..."></div>

      <div id="save-app-btn" class="btn btn-primary" style="width:100%; text-align:center; user-select:none;"
        onclick="submitAppForm()">保存</div>
      <div class="btn btn-outline" style="width:100%; margin-top:10px; text-align:center; user-select:none;"
        id="close-admin-btn">閉じる</div>
    </div>
  </div>

  <!-- テーマモーダル -->
  <div id="themeModal" class="modal" onclick="closeModal(event, 'themeModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 style="margin-bottom:20px">テーマを選択</h3>
      <div id="themeGrid" class="theme-grid"></div>
      <button class="btn btn-primary" style="width:100%; margin-top:25px"
        onclick="closeModalWindow('themeModal')">閉じる</button>
    </div>
  </div>

  <script>
    let rawData = [];
    let targetCount = 100;
    let isAdmin = !!sessionStorage.getItem('adminKey');
    let spreadsheetUrl = '';
    let favorites = JSON.parse(localStorage.getItem('appkanri_favs') || '[]');

    // 12種類のテーマ
    const THEMES = [
      { id: 'light', name: '日和', bg: '#fffaf0', text: '#5c4033', accent: '#ff9e4a' },
      { id: 'dark', name: '月夜', bg: '#1e293b', text: '#f1f5f9', accent: '#6366f1' },
      { id: 'sakura', name: '桜', bg: '#fff0f5', text: '#5d4037', accent: '#f48fb1' },
      { id: 'cyber', name: '電脳', bg: '#050505', text: '#fcee0a', accent: '#00f3ff' },
      { id: 'ocean', name: '海', bg: '#e3f2fd', text: '#1565c0', accent: '#29b6f6' },
      { id: 'forest', name: '森', bg: '#e8f5e9', text: '#2e7d32', accent: '#66bb6a' },
      { id: 'sunset', name: '夕焼', bg: '#fff3e0', text: '#e65100', accent: '#ff7043' },
      { id: 'grape', name: '葡萄', bg: '#f3e5f5', text: '#6a1b9a', accent: '#ab47bc' },
      { id: 'mint', name: '薄荷', bg: '#e0f2f1', text: '#00695c', accent: '#26a69a' },
      { id: 'gold', name: '金', bg: '#fffde7', text: '#f57f17', accent: '#fdd835' },
      { id: 'snow', name: '雪', bg: '#eceff1', text: '#37474f', accent: '#78909c' },
      { id: 'night', name: '漆黒', bg: '#121212', text: '#e0e0e0', accent: '#bb86fc' }
    ];

    window.onload = function () {
      applyTheme(localStorage.getItem('appkanri_theme') || 'light');
      initThemeGrid();

      document.body.addEventListener('click', function (e) {
        var target = e.target;
        if (target.id === 'close-admin-btn' || target.closest('#close-admin-btn')) {
          closeModalWindow('adminModal');
        }
      }, true);

      fetch('/api/data')
        .then(function (r) { return r.json(); })
        .then(function (res) {
          rawData = res.apps;
          spreadsheetUrl = res.spreadsheetUrl || '';
          targetCount = res.targetCount || 100;

          if (res.notice) {
            document.getElementById('notice-area').innerHTML =
              '<div class="notice-bar">' +
              '<span class="material-icons" style="font-size:20px; color:var(--accent-primary)">campaign</span>' +
              res.notice +
              '</div>';
          }

          updateStats();
          renderCategories();
          buildCategorySelect('');
          updateView();

          document.getElementById('loading').style.opacity = '0';
          setTimeout(function () {
            document.getElementById('loading').style.display = 'none';
          }, 500);
        })
        .catch(function (error) {
          document.getElementById('loading').innerHTML =
            '<span class="material-icons" style="font-size:48px; color:#e11d48">error</span>' +
            '<p>読み込みエラー: ' + error + '</p>';
        });
    };

    function updateStats() {
      var totalApps = rawData.length;
      var totalLikes = rawData.reduce(function (sum, a) { return sum + (a.likes || 0); }, 0);
      var categories = new Set(rawData.map(function (a) { return a.category; })).size;

      document.getElementById('stat-total').innerText = totalApps;
      document.getElementById('stat-likes').innerText = totalLikes;
      document.getElementById('stat-categories').innerText = categories;

      var pct = Math.min(100, Math.round(totalApps / targetCount * 100));
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-label').innerText = totalApps + ' / ' + targetCount + ' 本（目標まであと ' + Math.max(0, targetCount - totalApps) + ' 本）';
    }

    function renderCategories() {
      var cats = ['すべて', '★お気に入り'];
      var seen = {};
      rawData.forEach(function (a) {
        if (a.category && !seen[a.category]) {
          seen[a.category] = true;
          cats.push(a.category);
        }
      });

      document.getElementById('category-bar').innerHTML = cats.map(function (c) {
        return '<div class="chip ' + (c === 'すべて' ? 'active' : '') + '" onclick="filterCat(\'' + c + '\', this)">' + c + '</div>';
      }).join('');
    }

    var currentCat = 'すべて';

    function filterCat(cat, el) {
      currentCat = cat;
      document.querySelectorAll('.chip').forEach(function (c) {
        c.classList.remove('active');
      });
      el.classList.add('active');
      updateView();
    }

    function updateView() {
      var list = rawData.slice();
      var q = document.getElementById('search').value.toLowerCase();
      var sort = document.getElementById('sort').value;

      if (currentCat === '★お気に入り') {
        list = list.filter(function (a) {
          return favorites.includes(a.id);
        });
      } else if (currentCat !== 'すべて') {
        list = list.filter(function (a) {
          return a.category === currentCat;
        });
      }

      if (q) {
        list = list.filter(function (a) {
          return a.title.toLowerCase().includes(q) || a.description.toLowerCase().includes(q);
        });
      }

      if (sort === 'likes') {
        list.sort(function (a, b) { return b.likes - a.likes; });
      } else if (sort === 'date') {
        list.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
      } else {
        list.sort(function (a, b) { return a.id - b.id; });
      }

      renderApps(list);
    }

    function renderApps(list) {
      var container = document.getElementById('app-list');

      if (list.length === 0) {
        container.innerHTML =
          '<div class="empty-state">' +
          '<span class="material-icons">search_off</span>' +
          '<p>アプリが見つかりませんでした</p>' +
          '</div>';
        return;
      }

      container.innerHTML = list.map(function (app) {
        var isFav = favorites.includes(app.id);

        var urlButtons = '';
        if (app.zipUrl) {
          urlButtons += '<button class="btn btn-outline btn-icon" onclick="window.open(\'' + app.zipUrl + '\')" title="ダウンロード"><span class="material-icons" style="font-size:18px">download</span></button>';
        }
        if (app.noteUrl) {
          urlButtons += '<button class="btn btn-outline btn-icon" onclick="window.open(\'' + app.noteUrl + '\')" title="note記事"><span class="material-icons" style="font-size:18px">article</span></button>';
        }
        if (app.sheetUrl) {
          urlButtons += '<button class="btn btn-outline btn-icon" onclick="window.open(\'' + app.sheetUrl + '\')" title="スプレッドシート"><span class="material-icons" style="font-size:18px">table_chart</span></button>';
        }

        var adminButtons = '';
        if (isAdmin) {
          adminButtons = '<button class="btn btn-outline" onclick="editApp(' + app.id + ')">編集</button>' +
            '<button class="btn btn-outline btn-icon" onclick="confirmDeleteApp(' + app.id + ', \'' + app.title.replace(/'/g, "\\'") + '\')" title="削除" style="color:#e11d48"><span class="material-icons" style="font-size:18px">delete</span></button>';
        }

        return '<div class="card">' +
          '<span class="material-icons card-fav ' + (isFav ? 'active' : '') + '" onclick="toggleFav(' + app.id + ')">star</span>' +
          '<span class="card-tag">' + app.category + '</span>' +
          '<div class="card-meta">#' + app.id + ' - ' + app.date + (app.isNew ? ' <span class="new-badge">NEW</span>' : '') + '</div>' +
          '<h2>' + app.title + '</h2>' +
          '<p>' + app.description + '</p>' +
          '<div class="card-actions">' +
          '<button class="btn btn-like" onclick="doLike(' + app.id + ', this)">' +
          '<span class="material-icons" style="font-size:18px; color:#e11d48">favorite</span>' +
          '<span>' + app.likes + '</span>' +
          '</button>' +
          '<div class="card-buttons">' +
          adminButtons +
          urlButtons +
          (app.appUrl ? '<button class="btn btn-primary" onclick="window.open(\'' + app.appUrl + '\')">使う</button>' : '') +
          '</div>' +
          '</div>' +
          '</div>';
      }).join('');
    }

    function doLike(id, btn) {
      fetch('/api/apps/' + id + '/like', { method: 'POST' })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.success) {
            btn.querySelector('span:last-child').innerText = res.count;
            var app = rawData.find(function (a) { return a.id === id; });
            if (app) app.likes = res.count;
            updateStats();
          }
        });
    }

    function toggleFav(id) {
      var i = favorites.indexOf(id);
      if (i > -1) {
        favorites.splice(i, 1);
      } else {
        favorites.push(id);
      }
      localStorage.setItem('appkanri_favs', JSON.stringify(favorites));
      updateView();
    }

    function openSpreadsheet() {
      if (spreadsheetUrl) {
        window.open(spreadsheetUrl);
      } else {
        alert('スプレッドシートのURLが設定されていません');
      }
    }

    function confirmDeleteApp(id, title) {
      if (confirm('「' + title + '」を削除しますか？\nこの操作は取り消せません。')) {
        fetch('/api/apps/' + id, {
          method: 'DELETE',
          headers: { 'X-Admin-Key': sessionStorage.getItem('adminKey') || '' }
        })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (res.success) {
              alert('削除しました');
              location.reload();
            } else {
              if (res.message === '権限がありません') {
                sessionStorage.removeItem('adminKey');
                isAdmin = false;
                alert('管理者キーが無効です。再度ログインしてください。');
              } else {
                alert('削除に失敗しました: ' + res.message);
              }
            }
          })
          .catch(function (err) { alert('削除に失敗しました: ' + err); });
      }
    }

    // 管理機能
    function openAdminModal(fromEdit) {
      if (!sessionStorage.getItem('adminKey')) {
        var key = prompt('管理者キーを入力してください:');
        if (!key) return;
        sessionStorage.setItem('adminKey', key);
        isAdmin = true;
        updateView();
      }
      if (!fromEdit) {
        document.getElementById('f-id').value = '';
        document.getElementById('f-title').value = '';
        document.getElementById('f-desc').value = '';
        buildCategorySelect('');
        document.getElementById('f-date').value = '';
        document.getElementById('f-url').value = '';
        document.getElementById('f-zip').value = '';
        document.getElementById('f-sheet').value = '';
        document.getElementById('f-note').value = '';
      }
      document.getElementById('adminModal').style.display = 'flex';
    }

    function saveNotice() {
      var txt = document.getElementById('noticetxt').value.trim();
      if (!txt) {
        alert('お知らせ内容を入力してください');
        return;
      }
      fetch('/api/notice', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Key': sessionStorage.getItem('adminKey') || ''
        },
        body: JSON.stringify({ text: txt })
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.success) {
            alert('お知らせを更新しました');
            location.reload();
          } else {
            if (res.message === '権限がありません') {
              sessionStorage.removeItem('adminKey');
              isAdmin = false;
              alert('管理者キーが無効です。再度ログインしてください。');
            } else {
              alert('エラー: ' + res.message);
            }
          }
        })
        .catch(function (e) { alert('エラー: ' + e); });
    }

    function buildCategorySelect(currentVal) {
      var cats = [];
      var seen = {};
      rawData.forEach(function (a) {
        if (a.category && !seen[a.category]) {
          seen[a.category] = true;
          cats.push(a.category);
        }
      });

      var sel = document.getElementById('f-cat');
      sel.innerHTML = '<option value="">選択してください</option>';
      cats.forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        sel.appendChild(opt);
      });
      var newOpt = document.createElement('option');
      newOpt.value = '__new__';
      newOpt.textContent = '＋ 新しいカテゴリ';
      sel.appendChild(newOpt);

      if (currentVal) {
        sel.value = currentVal;
        if (sel.value !== currentVal) {
          sel.value = '__new__';
          var newInput = document.getElementById('f-cat-new');
          newInput.style.display = 'block';
          newInput.value = currentVal;
        }
      }
    }

    function onCatChange() {
      var sel = document.getElementById('f-cat');
      var newInput = document.getElementById('f-cat-new');
      if (sel.value === '__new__') {
        newInput.style.display = 'block';
        newInput.focus();
      } else {
        newInput.style.display = 'none';
        newInput.value = '';
      }
    }

    function getSelectedCategory() {
      var sel = document.getElementById('f-cat');
      return sel.value === '__new__'
        ? document.getElementById('f-cat-new').value.trim()
        : sel.value;
    }

    function submitAppForm() {
      var data = {
        id: document.getElementById('f-id').value || null,
        title: document.getElementById('f-title').value,
        description: document.getElementById('f-desc').value,
        category: getSelectedCategory(),
        date: document.getElementById('f-date').value,
        appUrl: document.getElementById('f-url').value,
        zipUrl: document.getElementById('f-zip').value,
        sheetUrl: document.getElementById('f-sheet').value,
        noteUrl: document.getElementById('f-note').value
      };

      if (!data.title) {
        alert('タイトルは必須です');
        return;
      }

      fetch('/api/apps', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Key': sessionStorage.getItem('adminKey') || ''
        },
        body: JSON.stringify(data)
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.success) {
            alert('保存しました');
            location.reload();
          } else {
            if (res.message === '権限がありません') {
              sessionStorage.removeItem('adminKey');
              isAdmin = false;
              alert('管理者キーが無効です。再度ログインしてください。');
            } else {
              alert('エラー: ' + (res.message || 'エラーが発生しました'));
            }
          }
        })
        .catch(function (e) { alert('エラー: ' + e); });
    }

    function editApp(id) {
      var app = rawData.find(function (a) { return a.id === id; });
      if (!app) return;

      document.getElementById('f-id').value = app.id;
      document.getElementById('f-title').value = app.title;
      document.getElementById('f-desc').value = app.description;
      buildCategorySelect(app.category || '');
      var dateVal = app.date ? app.date.replace(/\//g, '-') : '';
      document.getElementById('f-date').value = dateVal;
      document.getElementById('f-url').value = app.appUrl || '';
      document.getElementById('f-zip').value = app.zipUrl || '';
      document.getElementById('f-sheet').value = app.sheetUrl || '';
      document.getElementById('f-note').value = app.noteUrl || '';
      openAdminModal(true);
    }

    // テーマ機能
    function openThemeModal() {
      document.getElementById('themeModal').style.display = 'flex';
    }

    function closeModalWindow(id) {
      document.getElementById(id).style.display = 'none';
    }

    function closeModal(e, id) {
      if (e.target.id === id) closeModalWindow(id);
    }

    function initThemeGrid() {
      var grid = document.getElementById('themeGrid');
      var currentTheme = localStorage.getItem('appkanri_theme') || 'light';

      THEMES.forEach(function (t) {
        var div = document.createElement('div');
        div.className = 'theme-item' + (t.id === currentTheme ? ' active' : '');
        div.style.background = t.bg;
        div.title = t.name;
        div.setAttribute('data-theme', t.id);
        div.onclick = function () {
          applyTheme(t.id);
          document.querySelectorAll('.theme-item').forEach(function (item) {
            item.classList.remove('active');
          });
          div.classList.add('active');
        };
        grid.appendChild(div);
      });
    }

    function applyTheme(id) {
      var t = THEMES.find(function (x) { return x.id === id; }) || THEMES[0];
      document.documentElement.style.setProperty('--bg-primary', t.bg);
      document.documentElement.style.setProperty('--text-primary', t.text);
      document.documentElement.style.setProperty('--accent-primary', t.accent);
      document.documentElement.style.setProperty('--accent-gradient', 'linear-gradient(135deg, ' + t.accent + ' 0%, ' + t.accent + '80 100%)');
      localStorage.setItem('appkanri_theme', id);
    }
  </script>
</body>

</html>
