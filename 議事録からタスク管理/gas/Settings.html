<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { font-family: sans-serif; padding: 16px; font-size: 14px; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 8px 24px; background: #4a86e8; color: white; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #3b6fd4; }
  #msg { margin-top: 12px; padding: 8px; border-radius: 4px; display: none; }
  .ok  { background: #dcfce7; color: #166534; }
  .err { background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
<h3>⚙️ スクリプトプロパティ設定</h3>
<label>GEMINI_API_KEY</label>
<input type="password" id="GEMINI_API_KEY" placeholder="入力すると上書き保存されます">

<label>SPREADSHEET_ID</label>
<input type="text" id="SPREADSHEET_ID">

<label>API_SECRET_TOKEN</label>
<input type="password" id="API_SECRET_TOKEN" placeholder="入力すると上書き保存されます">

<label>SLACK_WEBHOOK_URL（任意）</label>
<input type="text" id="SLACK_WEBHOOK_URL">

<label>NOTIFY_EMAIL（任意）</label>
<input type="email" id="NOTIFY_EMAIL">

<button onclick="save()">保存</button>
<div id="msg"></div>

<script>
google.script.run
  .withSuccessHandler(function(data) {
    ['SPREADSHEET_ID','SLACK_WEBHOOK_URL','NOTIFY_EMAIL','GEMINI_API_KEY','API_SECRET_TOKEN'].forEach(k => {
      if (data[k]) document.getElementById(k).placeholder = data[k];
    });
  })
  .getSettings();

function save() {
  const keys = ['GEMINI_API_KEY','SPREADSHEET_ID','API_SECRET_TOKEN','SLACK_WEBHOOK_URL','NOTIFY_EMAIL'];
  const formData = {};
  keys.forEach(k => { formData[k] = document.getElementById(k).value; });

  google.script.run
    .withSuccessHandler(function() { showMsg('✅ 保存しました', 'ok'); })
    .withFailureHandler(function(e) { showMsg('❌ ' + e.message, 'err'); })
    .saveSettings(formData);
}

function showMsg(text, cls) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = cls;
  el.style.display = 'block';
}
</script>
</body>
</html>
