name: Deploy GAS

on:
  push:
    branches: [main]
    paths:
      - 'workspace/gas/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Set up clasp credentials
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push to GAS
        working-directory: workspace/gas
        run: clasp push --force

      - name: Deploy new version
        working-directory: workspace/gas
        run: clasp deploy --deploymentId AKfycbxWjoeMPIHe7n9A1LiQd5pOwjbFtL1A7X9KC8RgNc9Qai8AfH62lPnu-dNVXtT2GEX7
