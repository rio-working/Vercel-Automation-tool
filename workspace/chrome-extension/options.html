<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Workspace Quick Add - 設定</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #1e293b;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      width: 420px;
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #3b82f6; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus { border-color: #3b82f6; }
    .hint { font-size: 11px; color: #94a3b8; margin-top: 4px; }
    .btns { display: flex; gap: 10px; margin-top: 20px; }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-ghost { background: #f1f5f9; color: #64748b; }
    .btn-ghost:hover { background: #e2e8f0; }
    .status { margin-top: 12px; font-size: 13px; min-height: 20px; }
    .status.success { color: #10b981; }
    .status.error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Workspace Quick Add 設定</h1>
    <div class="form-group">
      <label>GAS Web App URL</label>
      <input type="url" id="gas-url" placeholder="https://script.google.com/macros/s/...">
      <div class="hint">GASのウェブアプリURLを入力してください</div>
    </div>
    <div class="form-group">
      <label>API トークン</label>
      <input type="password" id="api-token" placeholder="APIトークン">
      <div class="hint">GASスクリプトプロパティの API_SECRET_TOKEN と同じ値</div>
    </div>
    <div class="btns">
      <button class="btn btn-primary" onclick="save()">保存</button>
      <button class="btn btn-ghost" onclick="testConnection()">テスト接続</button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
